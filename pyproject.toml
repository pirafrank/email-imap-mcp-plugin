[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-imap"
version = "0.1.0"
description = "A safe IMAP/SMTP mailbox CLI and Codex MCP plugin"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["mcp>=1.1,<2", "tomli>=2; python_version < '3.11'"]

[project.scripts]
email-imap = "email_imap.cli:main"
email-imap-mcp = "email_imap.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

